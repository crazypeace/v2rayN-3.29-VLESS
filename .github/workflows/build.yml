# 编译 + 打包 v2rayN-3.29-VLESS (Windows x64 / .NET Framework 4.8)
#
# 产物:
#   <name_prefix>-v<版本>.zip        只有程序
#   <name_prefix>-Core-v<版本>.zip   程序 + Xray 内核 + geo 数据
#
# 手动跑: Actions → Build and Package → Run workflow
# 也可以指定 release_tag 直接把两个 zip 传上去
#
# 内核: 只打包 Xray (v26.3.27 起支持 hysteria2 出站, 配置形状与 v2ray 不同)
#       默认用 crazypeace/Xray-core-allowInsecure 的补丁版, 以保住订阅里的 allowInsecure
name: Build and Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 3.29.0.16)。留空 = 读 v2rayN/Properties/AssemblyInfo.cs'
        required: false
        default: ''
      name_prefix:
        description: '产物文件名前缀'
        required: false
        default: 'v2rayN-Reality-Hy2'
      xray_version:
        description: 'Xray 版本 tag(如 v26.3.27)。必须 >= v26.1.13 才有 hysteria2 出站'
        required: false
        default: 'v26.3.27'
      xray_allowinsecure:
        description: 'true = 用 crazypeace/Xray-core-allowInsecure 的补丁内核(永久允许 allowInsecure); false = 官方 Xray'
        type: boolean
        default: true
      geoip_version:
        description: 'geoip-only-cn-private.dat 的来源版本(v2fly/geoip), 或 latest'
        required: false
        default: 'latest'
      release_tag:
        description: '上传到这个 Release tag。留空 = 只作为 Actions artifact'
        required: false
        default: ''
  push:
    branches: [ master ]

permissions:
  contents: write

env:
  XRAY_VERSION: ${{ inputs.xray_version || 'v26.3.27' }}
  GEOIP_VERSION: ${{ inputs.geoip_version || 'latest' }}
  NAME_PREFIX: ${{ inputs.name_prefix || 'v2rayN-Reality-Hy2' }}
  VERSION_INPUT: ${{ inputs.version || '' }}
  RELEASE_TAG: ${{ inputs.release_tag || '' }}
  # 布尔型不能写成 inputs.x || 'true': 手动选 false 也会被 || 吃成 true
  XRAY_ALLOWINSECURE_INPUT: ${{ inputs.xray_allowinsecure }}

jobs:
  build:
    name: Build & Package (windows x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 读版本号
        id: ver
        shell: pwsh
        run: |
          $v = $env:VERSION_INPUT.Trim()
          if ([string]::IsNullOrWhiteSpace($v)) {
            $m = Select-String -Path 'v2rayN/Properties/AssemblyInfo.cs' -Pattern 'AssemblyFileVersion\("([0-9\.]+)"\)'
            if (-not $m) { Write-Error 'AssemblyInfo.cs 里找不到 AssemblyFileVersion'; exit 1 }
            $v = $m.Matches[0].Groups[1].Value
          }
          Write-Host "APP_VERSION=$v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "app_version=$v" >> $env:GITHUB_ENV
          # 没给输入(push 触发)时用默认值 true
          $ai = $env:XRAY_ALLOWINSECURE_INPUT
          if ($ai -ne 'true' -and $ai -ne 'false') { $ai = 'true' }
          "xray_allowinsecure=$ai" >> $env:GITHUB_ENV
          Write-Host "XRAY_ALLOWINSECURE=$ai"

      - name: 编译 (Release, Any CPU)
        run: msbuild v2rayN.sln -restore -p:Configuration=Release -p:Platform="Any CPU" -m -v:m

      - name: 检查编译产物
        shell: pwsh
        run: |
          # v2rayUpgrade.exe 由 v2rayN.csproj 的 PostBuildEvent 拷到同一目录
          foreach ($f in @('v2rayN/bin/Release/v2rayN.exe', 'v2rayN/bin/Release/v2rayUpgrade.exe')) {
            if (-not (Test-Path $f)) { Write-Error "缺少编译产物: $f"; exit 1 }
          }
          '### 编译产物 (v2rayN/bin/Release)' >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem v2rayN/bin/Release -Recurse -File | Select-Object -ExpandProperty Name >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: 下载 Xray 内核 + geo 数据
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path cores/xray | Out-Null

          if ($env:xray_allowinsecure -eq 'true') {
            $repo = 'crazypeace/Xray-core-allowInsecure'
            $tag  = "$($env:XRAY_VERSION)-allowInsecure"
            $pat  = 'win64'
          } else {
            $repo = 'XTLS/Xray-core'
            $tag  = $env:XRAY_VERSION
            $pat  = 'windows-64\.zip$'
          }
          Write-Host "Xray 内核: $repo @ $tag"
          $name = (gh release view $tag --repo $repo --json assets --jq '.assets[].name' | Where-Object { $_ -match $pat } | Select-Object -First 1)
          if (-not $name) { Write-Error "在 $repo@$tag 里找不到匹配 '$pat' 的 asset"; exit 1 }
          Invoke-WebRequest -Uri "https://github.com/$repo/releases/download/$tag/$name" -OutFile cores/xray.zip
          Expand-Archive cores/xray.zip -DestinationPath cores/xray -Force

          # geo 数据从官方 Xray 包取 (补丁内核的包里只有 xray.exe, 没有 geo 数据)
          if (-not (Test-Path cores/xray/geoip.dat)) {
            Write-Host "从官方 Xray 包取 geo 数据: XTLS/Xray-core @ $($env:XRAY_VERSION)"
            $geoName = (gh release view $env:XRAY_VERSION --repo XTLS/Xray-core --json assets --jq '.assets[].name' | Where-Object { $_ -match 'windows-64\.zip$' } | Select-Object -First 1)
            if (-not $geoName) { Write-Error "官方 Xray @ $($env:XRAY_VERSION) 里找不到 Xray-windows-64.zip"; exit 1 }
            Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/$($env:XRAY_VERSION)/$geoName" -OutFile cores/xray-geo.zip
            Expand-Archive cores/xray-geo.zip -DestinationPath cores/xray-geo -Force
            Copy-Item cores/xray-geo/geoip.dat   cores/xray/geoip.dat   -Force
            Copy-Item cores/xray-geo/geosite.dat cores/xray/geosite.dat -Force
          }

          # geoip-only-cn-private.dat 从 v2fly/geoip 取 (不再打包 v2ray 内核, 拿不到 v2ray 包里的这份)
          Write-Host "geoip-only-cn-private.dat: v2fly/geoip @ $($env:GEOIP_VERSION)"
          if ($env:GEOIP_VERSION -eq 'latest') {
            gh release download --repo v2fly/geoip --pattern 'geoip-only-cn-private.dat' --dir cores --clobber
          } else {
            gh release download $env:GEOIP_VERSION --repo v2fly/geoip --pattern 'geoip-only-cn-private.dat' --dir cores --clobber
          }

          Get-ChildItem cores -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: 组装 + 打包
        shell: pwsh
        run: |
          $v = $env:app_version
          $prefix = $env:NAME_PREFIX
          Remove-Item -Recurse -Force package-app, package, dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package-app, package, dist | Out-Null

          # 1) 只有程序 (app.publish/ 是构建产生的 ClickOnce 中间目录, 不打包)
          Copy-Item 'v2rayN/bin/Release/*' package-app -Recurse -Force
          Remove-Item -Recurse -Force 'package-app/app.publish' -ErrorAction SilentlyContinue
          Copy-Item 'package-app/*' package -Recurse -Force

          # 2) 内核 + geo 数据
          #    注意: 不要放内核包里的 config.json (会盖掉程序自己的默认配置)
          Copy-Item cores/xray/xray.exe   package/
          Copy-Item cores/xray/geoip.dat  package/
          Copy-Item cores/xray/geosite.dat package/
          Copy-Item cores/geoip-only-cn-private.dat package/

          foreach ($f in @('xray.exe','geoip.dat','geosite.dat','geoip-only-cn-private.dat','v2rayN.exe')) {
            if (-not (Test-Path "package/$f")) { Write-Error "package 里缺少 $f"; exit 1 }
          }

          $zipApp  = "dist/$prefix-v$v.zip"
          $zipCore = "dist/$prefix-Core-v$v.zip"
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if ($sevenZip) {
            & $sevenZip a -mx=5 -tzip $zipApp  '.\package-app\*' | Out-Null
            & $sevenZip a -mx=5 -tzip $zipCore '.\package\*'     | Out-Null
          } else {
            Compress-Archive -Path 'package-app/*' -DestinationPath $zipApp  -Force
            Compress-Archive -Path 'package/*'     -DestinationPath $zipCore -Force
          }

          '### 打包结果' >> $env:GITHUB_STEP_SUMMARY
          "- 程序版本: $v" >> $env:GITHUB_STEP_SUMMARY
          "- Xray: $($env:XRAY_VERSION)  (allowInsecure 补丁版 = $($env:xray_allowinsecure))" >> $env:GITHUB_STEP_SUMMARY
          "- geoip-only-cn-private.dat: v2fly/geoip $($env:GEOIP_VERSION)" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist | ForEach-Object { "- $($_.Name)  -  $([math]::Round($_.Length/1MB,2)) MB" } >> $env:GITHUB_STEP_SUMMARY

      - name: 上传 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME_PREFIX }}-v${{ steps.ver.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: 上传到 Release
        if: env.RELEASE_TAG != '' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --title $tag --notes "CI 打包: $($env:app_version)"
          }
          gh release upload $tag dist/*.zip --repo ${{ github.repository }} --clobber
          gh release view $tag --repo ${{ github.repository }} --json assets --jq '.assets[] | "\(.name)  \(.size)"'
